<!DOCTYPE html>
<html lang="id" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIPTA POS - Aplikasi Inventory Toko Komputer</title>
  <meta name="description"
    content="Aplikasi Android POS Kasir & Manajemen Inventory Toko Komputer Simpel & Responsive." />

  <!-- Manifest PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📱</text></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600"
    rel="stylesheet">

  <!-- Custom Android POS Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- React 18 & ReactDOM 18 UMD (Loaded via standard script tags) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Root React Mounting Point -->
  <div id="root">
    <div class="min-h-screen flex items-center justify-center p-6 text-center">
      <div class="space-y-4">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-slate-400 font-medium text-sm">Memuat Aplikasi POS Toko Komputer...</p>
      </div>
    </div>
  </div>

  <!-- Standard JS Helper Files -->
  <script src="./js/dummyData.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/storage.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed', err));
      });
    }

    // Capture PWA Install Prompt
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new Event('pwa-install-ready'));
    });
  </script>

  <!-- Inline Babel Script Block (CORS-Proof) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Category Hardware Icons Map
    const CATEGORY_ICONS = {
      'Processor': '🧠',
      'Kartu Grafis (GPU)': '🎮',
      'Motherboard': '🖥️',
      'Memori (RAM)': '⚡',
      'Penyimpanan (SSD/HDD)': '💾',
      'Power Supply (PSU)': '🔌',
      'Casing PC': '📦',
      'Pendingin (Cooling)': '❄️',
      'Aksesoris & Perifer': '🎧'
    };

    function Header({ currentTheme, onToggleTheme, lowStockCount, onOpenAddModal, onOpenStockModal, onNavigateTab, globalSearch, setGlobalSearch, stats, userRole, onToggleRole, authUser, onLogout, products }) {
      const [showNotif, setShowNotif] = React.useState(false);
      const [canInstall, setCanInstall] = React.useState(!!window.deferredPrompt);
      const notifRef = React.useRef(null);

      React.useEffect(() => {
        const handleInstallReady = () => setCanInstall(true);
        window.addEventListener('pwa-install-ready', handleInstallReady);
        return () => window.removeEventListener('pwa-install-ready', handleInstallReady);
      }, []);

      const handleInstallPWA = async () => {
        if (!window.deferredPrompt) return;
        window.deferredPrompt.prompt();
        const { outcome } = await window.deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          setCanInstall(false);
        }
        window.deferredPrompt = null;
      };

      // Close panel on outside click
      React.useEffect(() => {
        const handler = (e) => {
          if (notifRef.current && !notifRef.current.contains(e.target)) {
            setShowNotif(false);
          }
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      const lowStockItems = (products || [])
        .filter(p => p.stock <= (p.minStock || 5))
        .sort((a, b) => a.stock - b.stock);

      return (
        <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
          <div className="flex items-center justify-between gap-3 max-w-7xl mx-auto">

            {/* Store Brand */}
            <div className="flex items-center gap-2.5 shrink-0">
              <div className="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-600/30">
                📱
              </div>
              <div className="hidden sm:block">
                <h1 className="font-extrabold text-base leading-none tracking-tight flex items-center gap-1.5 text-white">
                  CIPTA POS
                  <span className="text-[10px] px-1.5 py-0.2 rounded bg-blue-500/20 text-blue-400 font-semibold border border-blue-500/30">
                    ANDROID
                  </span>
                </h1>
                <p className="text-[11px] text-slate-400">Inventory &amp; Kasir Toko Komputer</p>
              </div>
            </div>

            {/* Quick Search */}
            <div className="relative flex-1 max-w-md mx-1 sm:mx-2">
              <input
                type="text"
                placeholder="Cari SKU, Nama Barang, Merk..."
                value={globalSearch}
                onChange={(e) => {
                  setGlobalSearch(e.target.value);
                  onNavigateTab('pos');
                }}
                className="w-full pl-9 pr-8 py-2 rounded-xl text-xs glass-input placeholder-slate-400"
              />
              <span className="absolute left-3 top-2.5 text-slate-400 text-xs">🔍</span>
              {globalSearch && (
                <button onClick={() => setGlobalSearch('')} className="absolute right-3 top-2.5 text-slate-400 hover:text-white">✕</button>
              )}
            </div>

            {/* Right Actions */}
            <div className="flex items-center gap-2 shrink-0">
              
              {/* PWA Install Button */}
              {canInstall && (
                <button
                  onClick={handleInstallPWA}
                  className="hidden sm:flex px-3 py-1.5 rounded-xl text-xs font-bold border transition-all items-center gap-1.5 bg-indigo-600/20 text-indigo-400 border-indigo-500/40 hover:bg-indigo-600/30 shadow-[0_0_15px_rgba(79,70,229,0.2)] animate-pulse hover:animate-none"
                  title="Install Aplikasi ke Perangkat (PWA)"
                >
                  <span className="text-sm">⬇️</span>
                  <span>Install App</span>
                </button>
              )}

              {/* Role Badge */}
              <div
                className={`px-2.5 py-1.5 rounded-xl text-xs font-bold border transition-all flex items-center gap-1.5 ${userRole === 'admin'
                  ? 'bg-blue-600/20 text-blue-400 border-blue-500/40'
                  : 'bg-emerald-600/20 text-emerald-400 border-emerald-500/40'
                  }`}
              >
                <span className="text-sm">{userRole === 'admin' ? '👨‍💼' : '🧑‍💻'}</span>
                <span className="capitalize font-semibold">{userRole === 'admin' ? 'Admin' : 'Kasir'}</span>
              </div>

              {/* Notification Bell with Dropdown */}
              <div className="relative" ref={notifRef}>
                <button
                  onClick={() => setShowNotif(v => !v)}
                  className={`relative p-2 rounded-xl border transition-all ${lowStockCount > 0
                    ? 'bg-amber-500/10 border-amber-500/30 text-amber-400 hover:bg-amber-500/20'
                    : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                    }`}
                  title={lowStockCount > 0 ? `${lowStockCount} Stok Menipis` : 'Semua stok aman'}
                >
                  <span className="text-sm">🔔</span>
                  {lowStockCount > 0 && (
                    <span className="absolute -top-1 -right-1 w-4 h-4 bg-rose-500 text-white font-bold text-[10px] rounded-full flex items-center justify-center animate-pulse">
                      {lowStockCount}
                    </span>
                  )}
                </button>

                {/* Dropdown Panel */}
                {showNotif && (
                  <div className="absolute right-0 top-full mt-2 w-72 rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl shadow-black/60 z-50 overflow-hidden">
                    {/* Panel Header */}
                    <div className="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <span className="text-amber-400">🔔</span>
                        <span className="text-sm font-bold text-white">Notifikasi Stok</span>
                      </div>
                      {lowStockCount > 0 && (
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 font-bold border border-rose-500/30">
                          {lowStockCount} item
                        </span>
                      )}
                    </div>

                    {/* List */}
                    <div className="max-h-64 overflow-y-auto divide-y divide-slate-800">
                      {lowStockItems.length === 0 ? (
                        <div className="px-4 py-6 text-center">
                          <div className="text-2xl mb-1">✅</div>
                          <p className="text-xs text-slate-400 font-medium">Semua stok dalam kondisi aman</p>
                        </div>
                      ) : (
                        lowStockItems.map(p => (
                          <button
                            key={p.id}
                            onClick={() => { setShowNotif(false); onNavigateTab('inventory'); }}
                            className="w-full text-left px-4 py-3 hover:bg-slate-800 transition-all flex items-center gap-3"
                          >
                            <div className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm shrink-0 font-bold ${p.stock === 0
                              ? 'bg-rose-500/20 text-rose-400'
                              : 'bg-amber-500/20 text-amber-400'
                              }`}>
                              {p.stock === 0 ? '❌' : '⚠️'}
                            </div>
                            <div className="flex-1 min-w-0">
                              <p className="text-xs font-semibold text-white truncate">{p.name}</p>
                              <p className="text-[10px] text-slate-400 font-mono">{p.sku}</p>
                            </div>
                            <div className="text-right shrink-0">
                              <p className={`text-xs font-bold ${p.stock === 0 ? 'text-rose-400' : 'text-amber-400'}`}>
                                {p.stock} pcs
                              </p>
                              <p className="text-[10px] text-slate-500">tersisa</p>
                            </div>
                          </button>
                        ))
                      )}
                    </div>

                    {/* Footer */}
                    {lowStockItems.length > 0 && (
                      <div className="px-4 py-2.5 border-t border-slate-800">
                        <button
                          onClick={() => { setShowNotif(false); onNavigateTab('inventory'); }}
                          className="w-full py-1.5 rounded-xl text-xs font-semibold text-center bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 transition-all"
                        >
                          Lihat Semua di Inventory →
                        </button>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Theme Toggle */}
              <button
                onClick={onToggleTheme}
                className="p-2 rounded-xl border border-slate-800 bg-slate-800 text-slate-200 hover:bg-slate-700 transition-all text-sm"
              >
                {currentTheme === 'dark' ? '☀️' : '🌙'}
              </button>

              {/* User Info & Logout Button */}
              {authUser && (
                <div className="flex items-center gap-1.5 border-l border-slate-800 pl-2">
                  <div className="hidden lg:flex flex-col text-right leading-tight">
                    <span className="text-xs font-bold text-white truncate max-w-[120px]">{authUser.name}</span>
                    <span className="text-[10px] text-slate-400 font-mono">@{authUser.username}</span>
                  </div>
                  <button
                    onClick={onLogout}
                    className="p-2 rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-all text-xs font-semibold flex items-center gap-1 active:scale-95"
                    title="Keluar / Logout"
                  >
                    <span>🔒</span>
                    <span className="hidden sm:inline">Logout</span>
                  </button>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    // --- 2. ANDROID BOTTOM NAVIGATION BAR ---
    function BottomNav({ activeTab, onSelectTab }) {
      const items = [
        { id: 'pos', label: 'Kasir POS', icon: '🏪' },
        { id: 'inventory', label: 'Inventaris', icon: '📦' },
        { id: 'transactions', label: 'Transaksi', icon: '🔄' },
        { id: 'reports', label: 'Laporan', icon: '📊' },
        { id: 'settings', label: 'Pengaturan', icon: '⚙️' }
      ];

      return (
        <nav className="bottom-nav">
          {items.map(item => {
            const isActive = activeTab === item.id;
            return (
              <button
                key={item.id}
                onClick={() => onSelectTab(item.id)}
                className={`flex flex-col items-center justify-center w-full h-full text-[11px] font-medium transition-all ${isActive ? 'text-blue-500 font-bold scale-105' : 'text-slate-400 hover:text-slate-200'
                  }`}
              >
                <span className="text-lg leading-none mb-0.5">{item.icon}</span>
                <span>{item.label}</span>
              </button>
            );
          })}
        </nav>
      );
    }

    // --- 3. POS CATALOG & STOK GRID VIEW (MAIN ANDROID POS PAGE) ---
    function POSCatalogView({
      products,
      categories,
      searchTerm,
      setSearchTerm,
      onOpenStockModal
    }) {
      const utils = window.InventoryUtils;
      const [selectedCat, setSelectedCat] = useState('ALL');
      const [currentPage, setCurrentPage] = useState(1);
      const PAGE_SIZE = 12;

      const filtered = useMemo(() => {
        return products.filter(p => {
          const matchesCat = selectedCat === 'ALL' || p.category === selectedCat;
          const matchesSearch = utils.matchProductSearch(p, searchTerm);
          return matchesCat && matchesSearch;
        });
      }, [products, selectedCat, searchTerm]);

      // Reset ke halaman 1 saat filter/search berubah
      useEffect(() => { setCurrentPage(1); }, [selectedCat, searchTerm]);

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      const paginated = filtered.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      const getPageNumbers = () => {
        if (totalPages <= 5) return Array.from({ length: totalPages }, (_, i) => i + 1);
        if (currentPage <= 3) return [1, 2, 3, 4, '...', totalPages];
        if (currentPage >= totalPages - 2) return [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        return [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
      };

      return (
        <div className="space-y-4 pb-6">

          {/* Android Category Horizontal Chips Bar */}
          <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
            <button
              onClick={() => setSelectedCat('ALL')}
              className={`category-chip px-3.5 py-1.5 rounded-full text-xs font-semibold border ${selectedCat === 'ALL'
                ? 'active'
                : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'
                }`}
            >
              🏷️ Semua ({products.length})
            </button>
            {categories.map(cat => {
              const icon = CATEGORY_ICONS[cat] || '📦';
              const count = products.filter(p => p.category === cat).length;
              return (
                <button
                  key={cat}
                  onClick={() => setSelectedCat(cat)}
                  className={`category-chip px-3.5 py-1.5 rounded-full text-xs font-semibold border ${selectedCat === cat
                    ? 'active'
                    : 'bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800'
                    }`}
                >
                  <span>{icon} {cat} ({count})</span>
                </button>
              );
            })}
          </div>

          {/* Info hasil & halaman */}
          <div className="flex items-center justify-between px-1">
            <span className="text-[11px] text-slate-400">
              {filtered.length === 0
                ? 'Tidak ada produk'
                : `Menampilkan ${(currentPage - 1) * PAGE_SIZE + 1}–${Math.min(currentPage * PAGE_SIZE, filtered.length)} dari ${filtered.length} produk`
              }
            </span>
            <span className="text-[11px] text-slate-400 font-semibold">
              Hal. {currentPage} / {totalPages}
            </span>
          </div>

          {/* Product Cards POS Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            {paginated.length === 0 ? (
              <div className="col-span-full pos-card p-10 text-center space-y-2 text-slate-400">
                <div className="text-4xl">🔍</div>
                <p className="font-semibold text-slate-200 text-sm">Tidak ada produk komputer ditemukan</p>
                <p className="text-xs">Coba ganti filter kategori atau kata kunci pencarian.</p>
              </div>
            ) : (
              paginated.map(product => {
                const status = utils.getStockStatus(product.stock);
                const icon = CATEGORY_ICONS[product.category] || '💻';

                return (
                  <div key={product.id} className="pos-card p-3.5 flex flex-col justify-between space-y-3">

                    <div className="space-y-2">
                      <div className="flex items-start justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="text-2xl p-1.5 bg-slate-950 rounded-xl border border-slate-800">
                            {icon}
                          </span>
                          <div>
                            <span className="font-mono-code font-bold text-[11px] text-blue-400 block">
                              {product.sku}
                            </span>
                            <span className="text-[10px] px-1.5 py-0.2 rounded bg-slate-800 border border-slate-700 text-slate-300 font-semibold">
                              {product.brand}
                            </span>
                          </div>
                        </div>

                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${status.type === 'aman' ? 'badge-aman' : status.type === 'menipis' ? 'badge-menipis' : 'badge-habis'
                          }`}>
                          {product.stock} pcs ({status.label})
                        </span>
                      </div>

                      <h4 className="font-bold text-xs text-slate-100 leading-snug">
                        {product.name}
                      </h4>
                      <p className="text-[10px] text-slate-400">📍 {product.location || 'Gudang Utama'}</p>
                    </div>

                    <div className="pt-2 border-t border-slate-800/80 space-y-2">
                      <div className="flex justify-between items-baseline">
                        <span className="text-[10px] text-slate-400">Harga Jual:</span>
                        <span className="font-bold font-mono-code text-sm text-emerald-400">
                          {utils.formatRupiah(product.sellPrice)}
                        </span>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => onOpenStockModal(product.id, 'MASUK')}
                          className="py-1.5 px-2 rounded-xl text-[11px] font-semibold bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/30 transition-all flex items-center justify-center gap-1 active:scale-95"
                        >
                          <span>📥</span> Restock
                        </button>
                        <button
                          onClick={() => onOpenStockModal(product.id, 'KELUAR')}
                          className="py-1.5 px-2 rounded-xl text-[11px] font-semibold bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/30 transition-all flex items-center justify-center gap-1 active:scale-95"
                        >
                          <span>📤</span> Jual
                        </button>
                      </div>
                    </div>

                  </div>
                );
              })
            )}
          </div>

          {/* Pagination Controls */}
          {totalPages > 1 && (
            <div className="flex items-center justify-center gap-1.5 pt-2 flex-wrap">
              <button
                onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                disabled={currentPage === 1}
                className="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all disabled:opacity-30 disabled:cursor-not-allowed bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 active:scale-95"
              >
                ‹ Prev
              </button>

              {getPageNumbers().map((pg, idx) =>
                pg === '...'
                  ? <span key={`e${idx}`} className="px-1 text-slate-500 text-xs select-none">…</span>
                  : <button
                    key={pg}
                    onClick={() => setCurrentPage(pg)}
                    className={`w-8 h-8 rounded-xl text-xs font-bold border transition-all active:scale-95 ${currentPage === pg
                      ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-600/30'
                      : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
                      }`}
                  >
                    {pg}
                  </button>
              )}

              <button
                onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                disabled={currentPage === totalPages}
                className="px-3 py-1.5 rounded-xl text-xs font-semibold border transition-all disabled:opacity-30 disabled:cursor-not-allowed bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700 active:scale-95"
              >
                Next ›
              </button>
            </div>
          )}

        </div>
      );
    }

    // --- 4. PRODUCT DATA TABLE COMPONENT (NO WRAP ITEM LIST) ---
    function ProductTable({ products, categories, searchTerm, setSearchTerm, onOpenAddModal, onOpenEditModal, onOpenStockModal, onConfirmDelete, userRole }) {
      const utils = window.InventoryUtils;
      const [selectedCategory, setSelectedCategory] = useState('ALL');
      const [selectedStatus, setSelectedStatus] = useState('ALL');
      const [currentPage, setCurrentPage] = useState(1);
      const PAGE_SIZE = 10;

      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesSearch = utils.matchProductSearch(p, searchTerm);
          const matchesCategory = selectedCategory === 'ALL' || p.category === selectedCategory;

          const stock = Number(p.stock);
          let matchesStatus = true;
          if (selectedStatus === 'AMAN') matchesStatus = stock > 5;
          else if (selectedStatus === 'MENIPIS') matchesStatus = stock > 0 && stock <= 5;
          else if (selectedStatus === 'HABIS') matchesStatus = stock <= 0;

          return matchesSearch && matchesCategory && matchesStatus;
        });
      }, [products, searchTerm, selectedCategory, selectedStatus]);

      // Reset ke halaman 1 saat filter/search berubah
      useEffect(() => { setCurrentPage(1); }, [selectedCategory, selectedStatus, searchTerm]);

      const totalPages = Math.max(1, Math.ceil(filteredProducts.length / PAGE_SIZE));
      const paginatedProducts = filteredProducts.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

      const getPageNumbers = () => {
        if (totalPages <= 5) return Array.from({ length: totalPages }, (_, i) => i + 1);
        if (currentPage <= 3) return [1, 2, 3, 4, '...', totalPages];
        if (currentPage >= totalPages - 2) return [1, '...', totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        return [1, '...', currentPage - 1, currentPage, currentPage + 1, '...', totalPages];
      };

      return (
        <div className="space-y-4 pb-6">

    // --- 6. STOCK TRANSACTION MODAL (MULTI-ITEM CART & ITEM BEBAS MODE) ---
    function StockModal({ isOpen, onClose, onSaveTransactionsBatch, products, initialProductId, initialType }) {
      if (!isOpen) return null;
      const utils = window.InventoryUtils;

      const [type, setType] = useState(initialType || 'MASUK');
      // Mode input: 'inventory' = dari stok, 'custom' = item bebas
      const [inputMode, setInputMode] = useState('inventory');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedProductId, setSelectedProductId] = useState(initialProductId || (products[0]?.id || ''));
      const [quantity, setQuantity] = useState(1);
      const [reference, setReference] = useState('');
      const [cart, setCart] = useState([]);

      // State untuk Item Bebas
      const [customName, setCustomName] = useState('');
      const [customPrice, setCustomPrice] = useState('');
      const [customQty, setCustomQty] = useState(1);

      const filteredProducts = useMemo(() => {
        return products.filter(p => utils.matchProductSearch(p, searchQuery));
      }, [products, searchQuery]);

      // Reset state saat modal dibuka
      useEffect(() => {
        if (isOpen) {
          const initId = initialProductId || (products[0]?.id || '');
          setSelectedProductId(initId);
          if (initialType) setType(initialType);
          setQuantity(1);
          setSearchQuery('');
          setCart([]);
          setInputMode('inventory');
          setCustomName('');
          setCustomPrice('');
          setCustomQty(1);
        }
      }, [isOpen, initialProductId, initialType]);

      // Otomatis pilih item pertama jika hasil pencarian berubah dan item terpilih tidak ada di hasil pencarian
      useEffect(() => {
        if (filteredProducts.length > 0) {
          const isStillIn = filteredProducts.some(p => p.id === selectedProductId);
          if (!isStillIn) {
            setSelectedProductId(filteredProducts[0].id);
          }
        }
      }, [filteredProducts, searchQuery]);

      const selectedProduct = products.find(p => p.id === selectedProductId) || filteredProducts[0] || products[0];
      const currentStock = selectedProduct ? Number(selectedProduct.stock) : 0;
      const qtyNum = Number(quantity) || 0;
      const newStock = type === 'MASUK' ? currentStock + qtyNum : Math.max(0, currentStock - qtyNum);

      const handleSelectProduct = (id) => {
        setSelectedProductId(id);
      };

      // Tambah dari inventory ke keranjang
      const handleAddToCart = () => {
        if (!selectedProduct || qtyNum <= 0) return;

        if (type === 'KELUAR') {
          const inCartQty = cart
            .filter(item => item.product && item.product.id === selectedProduct.id)
            .reduce((sum, item) => sum + item.quantity, 0);

          if (inCartQty + qtyNum > currentStock) {
            alert(`Stok tidak cukup! Stok tersedia: ${currentStock} pcs, Sudah di keranjang: ${inCartQty} pcs.`);
            return;
          }
        }

        const unitPrice = type === 'MASUK' ? (selectedProduct.buyPrice || 0) : (selectedProduct.sellPrice || 0);

        setCart(prev => {
          const existingIdx = prev.findIndex(i => i.product && i.product.id === selectedProduct.id && i.type === type && !i.isCustom);
          if (existingIdx >= 0) {
            const updated = [...prev];
            const old = updated[existingIdx];
            const updatedQty = old.quantity + qtyNum;
            updated[existingIdx] = {
              ...old,
              quantity: updatedQty,
              totalPrice: old.unitPrice * updatedQty
            };
            return updated;
          } else {
            return [...prev, {
              product: selectedProduct,
              quantity: qtyNum,
              unitPrice: unitPrice,
              totalPrice: unitPrice * qtyNum,
              type: type,
              isCustom: false
            }];
          }
        });

        setQuantity(1);
      };

      // Tambah Item Bebas ke keranjang
      const handleAddCustomToCart = () => {
        const trimmedName = customName.trim();
        const priceNum = Number(customPrice) || 0;
        const qtyC = Number(customQty) || 0;

        if (!trimmedName) { alert('Nama item tidak boleh kosong.'); return; }
        if (priceNum <= 0) { alert('Harga jual harus lebih dari 0.'); return; }
        if (qtyC <= 0) { alert('Jumlah harus lebih dari 0.'); return; }

        setCart(prev => [...prev, {
          product: null,
          customName: trimmedName,
          quantity: qtyC,
          unitPrice: priceNum,
          totalPrice: priceNum * qtyC,
          type: 'KELUAR',
          isCustom: true
        }]);

        setCustomName('');
        setCustomPrice('');
        setCustomQty(1);
      };

      const handleRemoveFromCart = (index) => {
        const item = cart[index];
        if (!item) return;
        const label = item.isCustom ? item.customName : item.product.name;
        if (window.confirm(`Hapus barang "${label}" dari keranjang transaksi?`)) {
          setCart(prev => prev.filter((_, idx) => idx !== index));
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();

        let itemsToProcess = [];

        if (cart.length > 0) {
          itemsToProcess = cart.map(item => {
            if (item.isCustom) {
              // Item bebas: tidak ada productId di inventory, tandai dengan prefix khusus
              return {
                productId: 'CUSTOM-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                productSku: '[ITEM BEBAS]',
                productName: item.customName,
                type: 'KELUAR',
                quantity: item.quantity,
                unitPrice: item.unitPrice,
                totalPrice: item.totalPrice,
                reference: reference.trim() || 'Penjualan Item Bebas',
                isCustomItem: true,
                timestamp: new Date().toISOString()
              };
            }
            return {
              productId: item.product.id,
              productSku: item.product.sku,
              productName: item.product.name,
              type: item.type,
              quantity: item.quantity,
              unitPrice: item.unitPrice,
              totalPrice: item.totalPrice,
              reference: reference.trim() || (item.type === 'MASUK' ? 'Restock Supplier (Multi)' : 'Penjualan Toko (Multi)'),
              timestamp: new Date().toISOString()
            };
          });
        } else {
          if (inputMode === 'custom') {
            // Single custom item tanpa keranjang
            const trimmedName = customName.trim();
            const priceNum = Number(customPrice) || 0;
            const qtyC = Number(customQty) || 0;
            if (!trimmedName) { alert('Nama item tidak boleh kosong.'); return; }
            if (priceNum <= 0) { alert('Harga jual harus lebih dari 0.'); return; }
            if (qtyC <= 0) { alert('Jumlah harus lebih dari 0.'); return; }
            itemsToProcess = [{
              productId: 'CUSTOM-' + Date.now(),
              productSku: '[ITEM BEBAS]',
              productName: trimmedName,
              type: 'KELUAR',
              quantity: qtyC,
              unitPrice: priceNum,
              totalPrice: priceNum * qtyC,
              reference: reference.trim() || 'Penjualan Item Bebas',
              isCustomItem: true,
              timestamp: new Date().toISOString()
            }];
          } else {
            if (!selectedProduct || qtyNum <= 0) return;
            if (type === 'KELUAR' && qtyNum > currentStock) {
              alert(`Stok tidak cukup! Stok tersedia: ${currentStock} pcs.`);
              return;
            }
            const unitPrice = type === 'MASUK' ? (selectedProduct.buyPrice || 0) : (selectedProduct.sellPrice || 0);
            itemsToProcess = [{
              productId: selectedProduct.id,
              productSku: selectedProduct.sku,
              productName: selectedProduct.name,
              type: type,
              quantity: qtyNum,
              unitPrice: unitPrice,
              totalPrice: unitPrice * qtyNum,
              reference: reference.trim() || (type === 'MASUK' ? 'Restock Supplier' : 'Penjualan Toko'),
              timestamp: new Date().toISOString()
            }];
          }
        }

        onSaveTransactionsBatch(itemsToProcess);
        onClose();
      };

      const cartGrandTotal = cart.reduce((sum, item) => sum + item.totalPrice, 0);
      const cartTotalPcs = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Untuk single custom mode (belum di keranjang)
      const customSingleTotal = (Number(customPrice) || 0) * (Number(customQty) || 0);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in">
          <div className="pos-card w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
            {/* Header Modal */}
            <div className="px-5 py-3 border-b border-slate-800 flex justify-between items-center bg-slate-900 shrink-0">
              <h3 className="font-bold text-sm text-white flex items-center gap-1.5">
                <span>{type === 'MASUK' ? '📥' : '📤'}</span>
                <span>Transaksi Stok {type === 'MASUK' ? 'Masuk (Restock)' : 'Keluar (Penjualan)'}</span>
              </h3>
              <button onClick={onClose} className="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4 overflow-y-auto">
              {/* Tipe Transaksi Switcher */}
              <div className="grid grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => { setType('MASUK'); setCart([]); setInputMode('inventory'); }}
                  className={`py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 flex items-center justify-center gap-1.5 ${type === 'MASUK'
                    ? 'bg-emerald-600 border-emerald-500 text-white shadow-lg shadow-emerald-600/30'
                    : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                >
                  <span>📥</span> Restock (Masuk)
                </button>
                <button
                  type="button"
                  onClick={() => { setType('KELUAR'); setCart([]); }}
                  className={`py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 flex items-center justify-center gap-1.5 ${type === 'KELUAR'
                    ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-600/30'
                    : 'bg-slate-900 border-slate-800 text-slate-400 hover:text-slate-200'
                    }`}
                >
                  <span>📤</span> Penjualan (Keluar)
                </button>
              </div>

              {/* Sub-mode switcher: hanya tampil di KELUAR */}
              {type === 'KELUAR' && (
                <div className="grid grid-cols-2 gap-1.5 p-1.5 bg-slate-900 rounded-xl border border-slate-800">
                  <button
                    type="button"
                    onClick={() => setInputMode('inventory')}

    function SettingsView({ onRequestBackup, onRequestRestore, onRequestReset, onRequestConfirm, categories, setCategories, products, productsCount, userRole, users = [], setUsers, authUser }) {
      const [newCatName, setNewCatName] = useState('');
      const [error, setError] = useState('');

      // State Tambah Kasir / User Baru
      const [newUserUsername, setNewUserUsername] = useState('');
      const [newUserName, setNewUserName] = useState('');
      const [newUserPassword, setNewUserPassword] = useState('');
      const [newUserRole, setNewUserRole] = useState('kasir');
      const [userError, setUserError] = useState('');

      const handleAddCategory = () => {
        if (userRole !== 'admin') return;
        const trimmed = newCatName.trim();
        if (!trimmed) { setError('Nama kategori tidak boleh kosong.'); return; }
        if (categories.includes(trimmed)) { setError('Kategori sudah ada.'); return; }
        setCategories(prev => [...prev, trimmed]);
        setNewCatName('');
        setError('');
      };

      const handleDeleteCategory = (cat) => {
        if (userRole !== 'admin') return;
        const usedBy = products.filter(p => p.category === cat).length;
        if (usedBy > 0) {
          setError(`Kategori "${cat}" masih digunakan oleh ${usedBy} produk. Ubah atau hapus produk tersebut terlebih dahulu.`);
          return;
        }
        if (onRequestConfirm) {
          onRequestConfirm({
            title: `🏷️ Hapus Kategori "${cat}"?`,
            message: `Kategori "${cat}" akan dihapus permanen dari daftar kategori toko.`,
            confirmText: 'Hapus Kategori',
            confirmBg: 'bg-rose-600 hover:bg-rose-500',
            icon: '🗑️',
            onConfirm: () => {
              setCategories(prev => prev.filter(c => c !== cat));
              setError('');
            }
          });
        } else {
          setCategories(prev => prev.filter(c => c !== cat));
          setError('');
        }
      };

      const handleAddUser = () => {
        if (userRole !== 'admin') return;
        const trimmedUsername = newUserUsername.trim().toLowerCase();
        const trimmedName = newUserName.trim();

        if (!trimmedUsername || !trimmedName || !newUserPassword) {
          setUserError('Semua kolom pengguna wajib diisi.');
          return;
        }

        if (users.some(u => u.username.toLowerCase() === trimmedUsername)) {
          setUserError(`Username "${trimmedUsername}" sudah terpakai.`);
          return;
        }

        const newUser = {
          id: 'usr-' + Date.now(),
          username: trimmedUsername,
          name: trimmedName,
          password: newUserPassword,
          role: newUserRole,
          active: true,
          createdAt: new Date().toISOString()
        };

        setUsers(prev => [...prev, newUser]);
        setNewUserUsername('');
        setNewUserName('');
        setNewUserPassword('');
        setNewUserRole('kasir');
        setUserError('');
      };

      const handleToggleUserActive = (targetUser) => {
        if (userRole !== 'admin') return;
        if (authUser && authUser.id === targetUser.id) {
          setUserError('Anda tidak dapat menonaktifkan akun sendiri yang sedang digunakan.');
          return;
        }
        const isDeactivating = targetUser.active;
        if (onRequestConfirm) {
          onRequestConfirm({
            title: isDeactivating ? `🚫 Nonaktifkan Akun ${targetUser.name}?` : `✅ Aktifkan Akun ${targetUser.name}?`,
            message: isDeactivating
              ? `Akun "${targetUser.name}" (@${targetUser.username}) tidak akan dapat digunakan untuk login.`
              : `Akun "${targetUser.name}" (@${targetUser.username}) akan dapat login kembali.`,
            confirmText: isDeactivating ? 'Nonaktifkan' : 'Aktifkan Akun',
            confirmBg: isDeactivating ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500',
            icon: isDeactivating ? '🚫' : '✅',
            onConfirm: () => {
              setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, active: !u.active } : u));
              setUserError('');
            }
          });
        } else {
          setUsers(prev => prev.map(u => u.id === targetUser.id ? { ...u, active: !u.active } : u));
          setUserError('');
        }
      };

      return (
        <div className="space-y-4 max-w-xl pb-6">
          <h2 className="text-xl font-bold text-white">Pengaturan App</h2>

          {/* Banner Status Akun */}
          <div className={`p-4 rounded-2xl border flex items-center justify-between gap-3 text-xs ${userRole === 'admin'
            ? 'bg-blue-500/10 border-blue-500/30 text-blue-300'
            : 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
            }`}>
            <div className="flex items-center gap-2.5">
              <span className="text-2xl">{userRole === 'admin' ? '👨‍💼' : '🧑‍💻'}</span>
              <div>
                <p className="font-bold text-sm">Mode Akun: <span className="uppercase">{userRole}</span></p>
                <p className="text-[11px] opacity-80 mt-0.5">
                  {userRole === 'admin'
                    ? 'Akses penuh: Tambah, edit, hapus barang, kelola akun kasir, kategori & reset database.'
                    : 'Akses terbatas: Hanya dapat melihat data & melakukan transaksi stok.'}
                </p>
              </div>
            </div>
          </div>

          {/* ── Manajemen Akun Kasir & Pengguna ── */}
          <div className="pos-card p-5 space-y-4">
            <div className="flex items-center gap-2">
              <span className="text-lg">👥</span>
              <h3 className="font-bold text-sm text-slate-200">Manajemen Akun Kasir & Pengguna</h3>
              <span className="ml-auto text-[11px] px-2 py-0.5 rounded-full bg-blue-600/20 text-blue-400 border border-blue-500/30 font-semibold">
                {users.length} akun
              </span>
            </div>

            {/* Form Tambah Kasir Baru (Admin Only) */}
            {userRole === 'admin' ? (
              <div className="space-y-3 p-3 bg-slate-900/60 border border-slate-800 rounded-2xl">
                <p className="text-xs font-semibold text-slate-300">➕ Tambah Kasir / Pengguna Baru</p>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <input
                    type="text"
                    placeholder="Username (misal: kasir2)"
                    value={newUserUsername}
                    onChange={e => { setNewUserUsername(e.target.value); setUserError(''); }}

    // --- MODAL VERIFIKASI PASSWORD ADMIN (BACKUP / RESTORE / RESET) ---
    function AdminPasswordModal({ isOpen, onClose, onConfirm, title, description, authUser }) {
      const [passwordInput, setPasswordInput] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        if (isOpen) {
          setPasswordInput('');
          setErrorMsg('');
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg('');

        if (!authUser || !authUser.password) {
          setErrorMsg('Sesi admin tidak valid. Silakan login kembali.');
          return;
        }

        if (passwordInput !== authUser.password) {
          setErrorMsg('⚠️ Password Admin salah! Akses ditolak.');
          return;
        }

        onConfirm();
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay animate-fade-in">
          <div className="pos-card w-full max-w-sm rounded-2xl p-5 space-y-4 text-center border border-slate-800 shadow-2xl">
            <div className="w-12 h-12 rounded-2xl bg-amber-500/15 border border-amber-500/30 text-amber-400 flex items-center justify-center text-2xl mx-auto shadow">
              🔒
            </div>

            <div className="space-y-1">
              <h3 className="font-bold text-sm text-white">{title || 'Konfirmasi Password Admin'}</h3>
              <p className="text-xs text-slate-400">{description || 'Masukkan password akun Admin Anda untuk melanjutkan.'}</p>
            </div>

            {errorMsg && (
              <div className="p-2.5 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-400 text-xs text-left font-medium">
                {errorMsg}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              <input
                type="password"
                required
                autoFocus
                placeholder="Masukkan Password Admin..."
                value={passwordInput}
                onChange={(e) => { setPasswordInput(e.target.value); setErrorMsg(''); }}
                className="w-full px-3.5 py-2.5 rounded-xl text-xs glass-input focus:ring-2 focus:ring-amber-500 text-center font-mono"
              />

              <div className="flex justify-center gap-2 pt-1">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all">Batal</button>
                <button type="submit" className="px-5 py-2 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-600/20 transition-all">Verifikasi & Lanjutkan</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- 7. LOGIN SCREEN COMPONENT ---
    function LoginScreen({ onLogin, users }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [rememberMe, setRememberMe] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        setError('');

        const trimmedUser = username.trim().toLowerCase();
        const foundUser = users.find(u => u.username.toLowerCase() === trimmedUser);

        if (!foundUser) {
          setError('Username tidak ditemukan.');
          return;
        }

        if (foundUser.password !== password) {
          setError('Password yang Anda masukkan salah.');
          return;
        }

        if (foundUser.active === false) {
          setError('⚠️ Akun Anda telah nonaktif. Hubungi Admin untuk mengaktifkan kembali.');
          return;
        }

        onLogin(foundUser, rememberMe);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">
          <div className="w-full max-w-md space-y-6">

            {/* Brand Header */}
            <div className="text-center space-y-2">
              <div className="w-16 h-16 rounded-3xl bg-blue-600 flex items-center justify-center text-white font-extrabold text-3xl mx-auto shadow-xl shadow-blue-600/30">
                📱
              </div>
              <h1 className="text-2xl font-black tracking-tight text-white flex items-center justify-center gap-2">
                CIPTA POS <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/30 font-semibold">ANDROID</span>
              </h1>
              <p className="text-xs text-slate-400">Sistem Kasir & Inventory Toko Komputer</p>
            </div>

            {/* Login Card */}
            <div className="pos-card p-6 space-y-5 rounded-3xl border border-slate-800 shadow-2xl">
              <div className="space-y-1">
                <h2 className="text-lg font-bold text-white">Masuk ke Akun</h2>
                <p className="text-xs text-slate-400">Silakan masukkan username dan password Anda.</p>
              </div>

              {error && (
                <div className="p-3 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{error}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="space-y-1">
                  <label className="text-xs font-semibold text-slate-300">Username</label>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={e => setUsername(e.target.value)}
                    placeholder="Masukkan username..."
                    className="w-full px-3.5 py-2.5 rounded-2xl text-xs glass-input focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div className="space-y-1">
                  <label className="text-xs font-semibold text-slate-300">Password</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="Masukkan password..."
                    className="w-full px-3.5 py-2.5 rounded-2xl text-xs glass-input focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                {/* Remember Me Checkbox */}
                <label className="flex items-center gap-2.5 cursor-pointer select-none group">
                  <div
                    className={`w-4 h-4 rounded flex items-center justify-center border transition-all shrink-0 ${rememberMe
                      ? 'bg-blue-600 border-blue-500 shadow shadow-blue-500/30'
                      : 'bg-slate-800 border-slate-700 group-hover:border-slate-500'
                      }`}
                    onClick={() => setRememberMe(p => !p)}
                  >
                    {rememberMe && <span className="text-[10px] text-white font-bold leading-none">✓</span>}
                  </div>
                  <input type="checkbox" className="hidden" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} />
                  <span className="text-xs text-slate-400 group-hover:text-slate-300 transition-colors">

    // --- 8. MAIN APP CONTROLLER ---
    function App() {
      const storage = window.InventoryStorage;
      const utils = window.InventoryUtils;

      const [products, setProducts] = useState(() => storage.getProducts());
      const [transactions, setTransactions] = useState(() => storage.getTransactions());
      const [categories, setCategories] = useState(() => storage.getCategories());
      const [users, setUsers] = useState(() => storage.getUsers());
      const [authUser, setAuthUser] = useState(() => {
        // Cek sesi aktif biasa
        const savedAuth = storage.getAuthUser();
        if (savedAuth) return savedAuth;
        // Cek token "Ingat Saya" — auto-login jika masih valid
        const rememberedUserId = storage.getRememberMe();
        if (rememberedUserId) {
          const allUsers = storage.getUsers();
          const rememberedUser = allUsers.find(u => u.id === rememberedUserId && u.active !== false);
          if (rememberedUser) {
            storage.saveAuthUser(rememberedUser);
            storage.saveRole(rememberedUser.role);
            return rememberedUser;
          } else {
            storage.clearRememberMe();
          }
        }
        return null;
      });
      const [theme, setTheme] = useState(() => storage.getTheme());
      const [userRole, setUserRole] = useState(() => {
        const savedAuth = storage.getAuthUser();
        return savedAuth ? savedAuth.role : storage.getRole();
      });

      const [activeTab, setActiveTab] = useState('pos');
      const [globalSearch, setGlobalSearch] = useState('');

      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [editingProduct, setEditingProduct] = useState(null);
      const [isStockModalOpen, setIsStockModalOpen] = useState(false);
      const [stockModalTargetId, setStockModalTargetId] = useState(null);
      const [stockModalType, setStockModalType] = useState('MASUK');
      const [deletingProduct, setDeletingProduct] = useState(null);
      const [toastMessage, setToastMessage] = useState('');

      const [adminAuthModal, setAdminAuthModal] = useState({
        isOpen: false,
        title: '',
        description: '',
        actionType: null,
        pendingRestoreData: null
      });

      const [confirmDialog, setConfirmDialog] = useState({
        isOpen: false,
        title: '',
        message: '',
        confirmText: 'Ya, Lanjutkan',
        confirmBg: 'bg-rose-600 hover:bg-rose-500',
        icon: '⚠️',
        onConfirm: () => { }
      });

      const openConfirmModal = (config) => {
        setConfirmDialog({
          isOpen: true,
          title: config.title || 'Konfirmasi Tindakan',
          message: config.message || 'Apakah Anda yakin?',
          confirmText: config.confirmText || 'Ya, Lanjutkan',
          confirmBg: config.confirmBg || 'bg-rose-600 hover:bg-rose-500',
          icon: config.icon || '⚠️',
          onConfirm: config.onConfirm || (() => { })
        });
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3500);
      };

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'light') root.classList.add('light');
        else root.classList.remove('light');
        storage.saveTheme(theme);
      }, [theme]);

      useEffect(() => { storage.saveProducts(products); }, [products]);
      useEffect(() => { storage.saveTransactions(transactions); }, [transactions]);
      useEffect(() => { storage.saveCategories(categories); }, [categories]);
      useEffect(() => { storage.saveUsers(users); }, [users]);
      useEffect(() => { storage.saveAuthUser(authUser); }, [authUser]);

      const stats = useMemo(() => utils.calculateStats(products), [products]);

      const handleLogin = (user, remember = false) => {
        setAuthUser(user);
        setUserRole(user.role);
        storage.saveAuthUser(user);
        storage.saveRole(user.role);
        if (remember) {
          storage.saveRememberMe(user.id);
          showToast(`Selamat datang, ${user.name}! Login tersimpan 14 hari.`);
        } else {
          storage.clearRememberMe();
          showToast(`Selamat datang kembali, ${user.name}! (${user.role.toUpperCase()})`);
        }
      };

      const handleLogout = () => {
        setAuthUser(null);
        storage.saveAuthUser(null);
        storage.clearRememberMe();
        showToast('Anda telah berhasil keluar dari akun.');
      };

      const handleLogoutRequest = () => {
        openConfirmModal({
          title: '🚪 Konfirmasi Keluar / Logout',
          message: `Apakah Anda yakin ingin keluar dari akun "${authUser?.name}" (@${authUser?.username})?`,
          confirmText: 'Ya, Keluar',
          confirmBg: 'bg-rose-600 hover:bg-rose-500',
          icon: '🚪',
          onConfirm: handleLogout
        });
      };

      const handleSaveProduct = (productData) => {
        if (userRole !== 'admin') {
          showToast('Akses ditolak: Hanya Admin yang dapat menambah/mengedit barang.');
          return;
        }
        if (productData.id) {
          setProducts(prev => prev.map(p => p.id === productData.id ? productData : p));
          showToast(`Produk "${productData.name}" diperbarui!`);
        } else {
          const newProduct = { ...productData, id: 'prod-' + Date.now(), createdAt: new Date().toISOString() };
          setProducts(prev => [newProduct, ...prev]);
          if (newProduct.stock > 0) {
            setTransactions(prev => [{
              id: 'trx-' + Date.now(),
              productId: newProduct.id,
              productSku: newProduct.sku,
              productName: newProduct.name,
              type: 'MASUK',
              quantity: newProduct.stock,
              unitPrice: newProduct.buyPrice,
              totalPrice: newProduct.buyPrice * newProduct.stock,
              reference: 'Stok Awal',
              timestamp: new Date().toISOString()
            }, ...prev]);
          }
          showToast(`Produk "${newProduct.name}" ditambahkan!`);
        }
        setIsProductModalOpen(false);
        setEditingProduct(null);
      };

      const handleSaveTransactionsBatch = (trxList) => {
        const items = Array.isArray(trxList) ? trxList : [trxList];
        if (items.length === 0) return;

        const timestampBase = Date.now();
        const newTrxArray = items.map((item, idx) => ({
          ...item,
          id: 'trx-' + timestampBase + '-' + idx
        }));

        // Hanya update stok untuk item yang ada di inventory (bukan item bebas)
        const inventoryItems = items.filter(trx => !trx.isCustomItem);
        if (inventoryItems.length > 0) {
          setProducts(prevProducts => {
            let updated = [...prevProducts];
            inventoryItems.forEach(trx => {
              updated = updated.map(p => {
                if (p.id === trx.productId) {
                  const currentQty = Number(p.stock) || 0;
                  const delta = trx.type === 'MASUK' ? trx.quantity : -trx.quantity;
                  return { ...p, stock: Math.max(0, currentQty + delta) };
                }
                return p;
              });
            });
            return updated;
          });
        }

        setTransactions(prev => [...newTrxArray, ...prev]);

        const customCount = items.filter(t => t.isCustomItem).length;
        const inventoryCount = items.length - customCount;
        const totalPcs = items.reduce((sum, i) => sum + i.quantity, 0);
        const totalRevenue = items.reduce((sum, i) => sum + i.totalPrice, 0);

        if (items.length === 1) {
          const item = items[0];
          if (item.isCustomItem) {
            showToast(`✍️ Item Bebas "${item.productName}" (${item.quantity} pcs) tercatat — Rp ${totalRevenue.toLocaleString('id-ID')}`);
          } else {
            showToast(`Stok ${item.type} (${item.quantity} pcs) berhasil diproses!`);
          }
        } else {
          const parts = [];
          if (inventoryCount > 0) parts.push(`${inventoryCount} item inventory`);
          if (customCount > 0) parts.push(`${customCount} item bebas`);
          showToast(`Transaksi selesai: ${parts.join(' + ')} (${totalPcs} pcs) berhasil!`);
        }
      };

      const handleConfirmDeleteProduct = (product) => {
        openConfirmModal({
          title: `📦 Hapus Produk [${product.sku}]?`,
          message: `Produk "${product.name}" akan dihapus permanen dari inventaris toko.`,
          confirmText: 'Hapus Produk',
          confirmBg: 'bg-rose-600 hover:bg-rose-500',
          icon: '🗑️',
          onConfirm: () => {
            if (userRole !== 'admin') {
              showToast('Akses ditolak: Hanya Admin yang dapat menghapus barang.');
              return;
            }
            setProducts(prev => prev.filter(p => p.id !== product.id));
            showToast(`Produk "${product.name}" dihapus.`);
          }
        });
      };

      // Delete transaction with confirmation
      const handleConfirmDeleteTransaction = (trx) => {
        openConfirmModal({
          title: `🗑️ Hapus Transaksi ${trx.id}?`,
          message: `Transaksi "${trx.productName}" (${trx.type}) akan dihapus permanen.`,
          confirmText: 'Hapus Transaksi',
          confirmBg: 'bg-rose-600 hover:bg-rose-500',
          icon: '🗑️',
          onConfirm: () => {
            if (userRole !== 'admin') {
              showToast('Akses ditolak: Hanya Admin yang dapat menghapus transaksi.');
              return;
            }
            setTransactions(prev => prev.filter(t => t.id !== trx.id));
            showToast(`Transaksi "${trx.productName}" dihapus.`);
          }
        });
      };

      // --- ALUR BACKUP, RESTORE & RESET DENGAN PASSWORD ADMIN ---
      const handleBackupRequest = () => {
        if (userRole !== 'admin') {
          showToast('Akses ditolak: Hanya Admin yang dapat mengunduh backup.');
          return;
        }
        setAdminAuthModal({
          isOpen: true,
          title: '🔒 Verifikasi Password - Backup Database',
          description: 'Masukkan password Admin untuk mengunduh berkas cadangan database (JSON).',
          actionType: 'BACKUP',
          pendingRestoreData: null
        });
      };

      const executeBackup = () => {
        const backupObject = {
          app: 'Cipta POS Toko Komputer',
          version: '1.0.0',
          backupDate: new Date().toISOString(),
          products: products,
          transactions: transactions,
          categories: categories,
          users: users
        };

        const jsonStr = JSON.stringify(backupObject, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const dateFormatted = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = `ciptapos_backup_${dateFormatted}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast('📥 Berkas backup database berhasil diunduh!');
      };

      const handleRestoreRequest = () => {
        if (userRole !== 'admin') {
          showToast('Akses ditolak: Hanya Admin yang dapat memulihkan database.');
          return;
        }

        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const parsed = JSON.parse(event.target.result);
              if (!parsed.products || !parsed.categories) {
                alert('Format file backup JSON tidak valid!');
                return;
              }

              setAdminAuthModal({
                isOpen: true,
                title: '🔒 Verifikasi Password - Restore Database',
                description: `File backup berisi ${parsed.products?.length || 0} produk & ${parsed.transactions?.length || 0} riwayat. Masukkan password Admin untuk memulihkan.`,
                actionType: 'RESTORE',
                pendingRestoreData: parsed
              });
            } catch (err) {
              alert('Gagal membaca file JSON backup: ' + err.message);
            }
          };
          reader.readAsText(file);
        };
        input.click();
      };

      const executeRestore = (data) => {
        if (!data) return;
        if (data.products) { setProducts(data.products); storage.saveProducts(data.products); }
        if (data.transactions) { setTransactions(data.transactions); storage.saveTransactions(data.transactions); }
        if (data.categories) { setCategories(data.categories); storage.saveCategories(data.categories); }
        if (data.users) { setUsers(data.users); storage.saveUsers(data.users); }

        showToast(`📤 Restore database berhasil! (${data.products?.length || 0} produk dipulihkan)`);
      };

      const handleResetRequest = () => {
        if (userRole !== 'admin') {
          showToast('Akses ditolak: Hanya Admin yang dapat mereset database.');
          return;
        }

        setAdminAuthModal({
          isOpen: true,
          title: '🔒 Verifikasi Password - Reset Database',
          description: 'PERINGATAN: Seluruh data toko akan di-reset ke data dummy awal! Masukkan password Admin untuk konfirmasi.',
          actionType: 'RESET',
          pendingRestoreData: null
        });
      };

      const executeReset = () => {
        const defaults = storage.resetToDefault();
        setProducts(defaults.products);
        setTransactions(defaults.transactions);
        setCategories(defaults.categories);
        setUsers(defaults.users);
        setAuthUser(null);
        showToast('🔄 Database berhasil di-reset ke data dummy awal! Silakan login kembali.');
      };

      const handleConfirmAdminAction = () => {
        if (adminAuthModal.actionType === 'BACKUP') {
          executeBackup();
        } else if (adminAuthModal.actionType === 'RESTORE') {
          executeRestore(adminAuthModal.pendingRestoreData);
        } else if (adminAuthModal.actionType === 'RESET') {
          executeReset();
        }
      };

      // Tampilkan Layar Login Jika Belum Autentikasi
      if (!authUser) {
        return (
          <>
            <LoginScreen onLogin={handleLogin} users={users} />
            <Toast message={toastMessage} onClose={() => setToastMessage('')} />
          </>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <Header
            currentTheme={theme}
            onToggleTheme={() => setTheme(prev => prev === 'dark' ? 'light' : 'dark')}
            lowStockCount={stats.lowStockCount}
            onOpenAddModal={() => { setEditingProduct(null); setIsProductModalOpen(true); }}
            onOpenStockModal={(id = null, type = 'MASUK') => { setStockModalTargetId(id); setStockModalType(type); setIsStockModalOpen(true); }}
            onNavigateTab={setActiveTab}
            globalSearch={globalSearch}
            setGlobalSearch={setGlobalSearch}
            stats={stats}
            userRole={userRole}
            authUser={authUser}
            onLogout={handleLogoutRequest}
            products={products}
          />

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4">
            {activeTab === 'pos' && (
              <POSCatalogView
                products={products}
                categories={categories}
                searchTerm={globalSearch}
                setSearchTerm={setGlobalSearch}
                onOpenStockModal={(id, type) => { setStockModalTargetId(id); setStockModalType(type); setIsStockModalOpen(true); }}
              />
            )}

            {activeTab === 'inventory' && (
              <ProductTable
                products={products}
                categories={categories}
                searchTerm={globalSearch}
                setSearchTerm={setGlobalSearch}
                onOpenAddModal={() => { setEditingProduct(null); setIsProductModalOpen(true); }}
                onOpenEditModal={(p) => { setEditingProduct(p); setIsProductModalOpen(true); }}
                onOpenStockModal={(id, type) => { setStockModalTargetId(id); setStockModalType(type); setIsStockModalOpen(true); }}
                onConfirmDelete={handleConfirmDeleteProduct}
                userRole={userRole}
              />
            )}

            {activeTab === 'transactions' && (
              <TransactionHistory
                transactions={transactions}
                onOpenStockModal={(id, type) => { setStockModalTargetId(id); setStockModalType(type); setIsStockModalOpen(true); }}
                onConfirmDelete={handleConfirmDeleteTransaction}
                userRole={userRole}
              />
            )}

            {activeTab === 'reports' && <ReportView products={products} categories={categories} />}

            {activeTab === 'settings' && (
              <SettingsView
                onRequestBackup={handleBackupRequest}
                onRequestRestore={handleRestoreRequest}
                onRequestReset={handleResetRequest}
                onRequestConfirm={openConfirmModal}
                categories={categories}
                setCategories={setCategories}
                products={products}
                productsCount={products.length}
                userRole={userRole}
                users={users}
                setUsers={setUsers}
                authUser={authUser}
              />
            )}
          </main>

          {/* Android FAB Floating Button (Hanya Admin) */}
          {userRole === 'admin' && (
            <button
              onClick={() => { setEditingProduct(null); setIsProductModalOpen(true); }}
              className="fab-button font-bold"
              title="Tambah Barang Baru"
            >
              +
            </button>
          )}

          {/* Android Bottom Navigation */}
          <BottomNav activeTab={activeTab} onSelectTab={setActiveTab} />

          {/* Modals */}
          <ProductModal
            isOpen={isProductModalOpen}
            onClose={() => { setIsProductModalOpen(false); setEditingProduct(null); }}
            onSave={handleSaveProduct}
            categories={categories}
            initialData={editingProduct}
          />

          <StockModal
            isOpen={isStockModalOpen}
            onClose={() => setIsStockModalOpen(false)}
            onSaveTransactionsBatch={handleSaveTransactionsBatch}
            products={products}
            initialProductId={stockModalTargetId}
            initialType={stockModalType}
          />

          <ConfirmDialogModal
            isOpen={confirmDialog.isOpen}
            onClose={() => setConfirmDialog(prev => ({ ...prev, isOpen: false }))}
            onConfirm={confirmDialog.onConfirm}
            title={confirmDialog.title}
            message={confirmDialog.message}
            confirmText={confirmDialog.confirmText}
            confirmBg={confirmDialog.confirmBg}
            icon={confirmDialog.icon}
          />

          <AdminPasswordModal
            isOpen={adminAuthModal.isOpen}
            onClose={() => setAdminAuthModal(prev => ({ ...prev, isOpen: false }))}
            onConfirm={handleConfirmAdminAction}
            title={adminAuthModal.title}
            description={adminAuthModal.description}
            authUser={authUser}
          />

          {/* Toast */}
          <Toast message={toastMessage} onClose={() => setToastMessage('')} />
        </div>
      );
    }


    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>

</html>
