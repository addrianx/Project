<!DOCTYPE html>
<html lang="id" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CIPTA POS - Aplikasi Inventory Toko Komputer</title>
  <meta name="description" content="Aplikasi Android POS Kasir & Manajemen Inventory Toko Komputer Simpel & Responsive." />

  <!-- Manifest PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📱</text></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600" rel="stylesheet">

  <!-- Custom Android POS Stylesheet -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- React 18 & ReactDOM 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel Standalone (compiles JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Mobile: Disable pinch-to-zoom & double-tap zoom (iOS / Android) -->
  <script>
    document.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    }, { passive: false });
  </script>
</head>

<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white">

  <!-- Root React Mounting Point -->
  <div id="root">
    <div class="min-h-screen flex items-center justify-center p-6 text-center">
      <div class="space-y-4">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
        <p class="text-slate-400 font-medium text-sm">Memuat Aplikasi POS Toko Komputer...</p>
      </div>
    </div>
  </div>

  <!-- Non-Babel utility scripts (plain JS, no JSX) -->
  <script src="./js/dummyData.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/constants.js"></script>

  <!-- PWA Service Worker & Install Prompt -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW reg failed', err));
      });
    }
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new Event('pwa-install-ready'));
    });
  </script>

  <!-- Babel-compiled React Components (order matters: dependencies first) -->
  <script type="text/babel" src="./js/components/Toast.js"></script>
  <script type="text/babel" src="./js/components/ConfirmDialogModal.js"></script>
  <script type="text/babel" src="./js/components/AdminPasswordModal.js"></script>
  <script type="text/babel" src="./js/components/LoginScreen.js"></script>
  <script type="text/babel" src="./js/components/Header.js"></script>
  <script type="text/babel" src="./js/components/BottomNav.js"></script>
  <script type="text/babel" src="./js/components/POSCatalogView.js"></script>
  <script type="text/babel" src="./js/components/ProductTable.js"></script>
  <script type="text/babel" src="./js/components/ProductModal.js"></script>
  <script type="text/babel" src="./js/components/StockModal.js"></script>
  <script type="text/babel" src="./js/components/TransactionHistory.js"></script>
  <script type="text/babel" src="./js/components/ReportView.js"></script>
  <script type="text/babel" src="./js/components/SettingsView.js"></script>

  <!-- App Entry Point (mounts React root) -->
  <script type="text/babel" src="./js/App.js"></script>

</body>

</html>
